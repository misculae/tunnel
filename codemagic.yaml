workflows:
  tunnel-android:
    name: TUNNEL Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files if missing
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.misculae --project-name tunnel .
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze Flutter code
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build Android APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_drive.log
